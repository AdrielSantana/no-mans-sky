name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; builds antigos na fila sao cancelados.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Espelha client/.env.production, que e gitignorado e nao chega no runner.
      VITE_SPACETIMEDB_URI: wss://maincloud.spacetimedb.com
      VITE_SPACETIMEDB_DATABASE: no-mans-sky
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # build:pages fixa --base=/no-mans-sky/: Pages serve o projeto num subcaminho.
      - run: pnpm --dir client build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
